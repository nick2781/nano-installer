[package]
name = "nano-installer"
version = "0.1.0"
edition = "2021"
# ⚠️ IMPORTANT: Rust 1.75 is the LAST version that supports Windows 7
# DO NOT upgrade to Rust 1.76+ as it requires Windows 10+
rust-version = "1.75"
authors = ["Your Name <your.email@example.com>"]
description = "Modern installer and uninstaller with multi-language support"

# [workspace]
# members = [".", "crates/*"]

[[bin]]
name = "installer"
path = "src/bin/installer.rs"

[[bin]]
name = "uninst"
path = "src/bin/uninstaller.rs"

[[bin]]
name = "langpack-builder"
path = "src/bin/langpack_builder.rs"

[dependencies]
# egui framework - better Win7+ support
eframe = { version = "0.28", default-features = true, features = ["default_fonts", "glow"] }
egui = "0.28"
egui_extras = { version = "0.28", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Compression & Archive
sevenz-rust = "0.5"
flate2 = "1.0"

# Windows specific
[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
    "Win32_Globalization",
    "Win32_UI_HiDpi",
] }
winreg = "0.52"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
once_cell = "1.19"
parking_lot = "0.12"
uuid = { version = "1.6", features = ["v4"] }
chrono = "0.4"

# Checksum
crc32fast = "1.3"
sha2 = "0.10"

[build-dependencies]
embed-resource = "2.4"
serde_json = "1.0"
crc32fast = "1.3"

[dev-dependencies]
tempfile = "3.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0

[features]
default = ["embedded-locales"]
# 未来的 macOS 支持
macos-support = []
# 嵌入语言包
embedded-locales = []
