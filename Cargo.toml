[workspace]
resolver = "2"
members = [
    "crates/nano-installer-core",
    "crates/nano-installer-cli",
    "crates/nano-installer-gui",
    "crates/nano-installer-plugin-sample",
    "crates/nano-installer-stub-lzma",
    "crates/nano-installer-stub-zlib",
    "crates/nano-installer-uninstaller",
]

[workspace.package]
version = "2026.10.10"
edition = "2021"
rust-version = "1.88"
authors = ["nano-installer contributors"]
description = "Native configuration-driven Windows installer framework"
license = "MIT"
repository = "https://github.com/Nick2781/nano-installer"
# The crates are this repository's own build units, not libraries to publish: they are
# Windows-only, they are built together by scripts/build.ps1, and several of them exist only to
# keep one archive backend out of another binary. Publishing one would ship a crate whose
# documented entry point is a generated executable, so this stays false until someone asks.
publish = false

[workspace.dependencies]
anyhow = "1.0"
roxmltree = "0.21"
serde_json = "1.0"
tempfile = "3.8"
winres = "0.1"
image = { version = "0.25.8", default-features = false, features = ["png"] }
sevenz-rust = { version = "0.6.1", default-features = false }
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
rhai = { version = "1.24", default-features = false, features = ["std", "only_i64", "no_module", "no_custom_syntax", "no_optimize", "no_time"] }
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow"] }
rfd = { version = "0.17.2", default-features = false }

[profile.release]
# Size is the metric a setup is judged by before it is run, and the runtime is
# embedded in every setup a project ships: `z` trades a little speed on paths
# that are dominated by file I/O and painting anyway. rhai is built without its
# optimizer and its timestamp type for the same reason -- neither is reachable
# from the script API this project documents.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The visual builder is a desktop application, not something a project ships, and
# `z` costs it more than it saves: it grew by 400 KB when the runtime's profile
# became size-first.
[profile.gui]
inherits = "release"
opt-level = "s"
