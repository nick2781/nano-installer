[workspace]
resolver = "2"
members = ["installer/native"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["nano-installer contributors"]
description = "Native configuration-driven Windows installer framework"
license = "MIT"
repository = "https://github.com/Nick2781/nano-installer"

[workspace.dependencies]
anyhow = "1.0"
roxmltree = "0.20"
serde_json = "1.0"
tempfile = "3.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
