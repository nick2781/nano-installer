[package]
name = "nano-installer"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
authors = ["Your Name <your.email@example.com>"]
description = "Modern installer and uninstaller with multi-language support"

[[bin]]
name = "nano-installer"
path = "src/bin/nano-installer.rs"

[dependencies]
# 基础依赖
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
once_cell = "1.19"

# 日志库
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# GUI 库 - 使用最新版本
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.33"
egui_extras = { version = "0.33", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }

# 文件对话框
rfd = "0.14"

# 异步运行时
tokio = { version = "1.38", features = ["full"] }

# 工具库
uuid = { version = "1.10", features = ["v4"] }
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
parking_lot = "0.12"

# 校验库
crc32fast = "1.3"
sha2 = "0.10"

# XML 解析库
quick-xml = "0.31"

# 正则表达式库
regex = "1.10"

# JSON with comments 解析库
jsonc-parser = "0.27"

# TOML 解析库
toml = "0.8"

# 压缩库 - 使用外部 7za.exe 工具
flate2 = "1.0"
zip = "0.6"

# Windows specific - 使用最新版本
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
    "Win32_System_Diagnostics",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_Globalization",
    "Win32_UI_HiDpi",
] }
winreg = "0.52"

[build-dependencies]
embed-resource = "2.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crc32fast = "1.3"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
jsonc-parser = "0.27"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0

[features]
default = []
# 未来的 macOS 支持
macos-support = []