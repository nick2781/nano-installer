[package]
name = "nano-installer-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Shared native bundle and Win32 runtime for nano-installer"

[lib]
name = "nano_installer_core"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
roxmltree.workspace = true
serde_json.workspace = true
rhai.workspace = true

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Environment",
    # What a program a script runs wrote is in the code page the machine runs
    # in, which is the one Windows decodes it with here.
    "Win32_Globalization",
    # A dependency the project cannot ship is fetched over the machine's own
    # HTTP stack, and what arrives is checked with the machine's own SHA-256.
    "Win32_Networking_WinHttp",
    "Win32_Security_Cryptography",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    # `PrintWindow` lives in the Xps module of the bindings, and the end-to-end
    # cases read a window back through it.
    "Win32_Storage_Xps",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Ime",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
tempfile.workspace = true
