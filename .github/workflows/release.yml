name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native-win7-release:
    name: Native Win7+ Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-11-08
          components: rust-src

      - name: Configure MSVC tools
        uses: ilammy/msvc-dev-cmd@v1

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build and audit Win7+ artifacts
        shell: powershell
        run: .\scripts\build.ps1 -Project examples\TapTap

      - name: Package native toolchain
        shell: powershell
        run: |
          $files = @(
            "target/release/nano-installer-native-x64.exe"
            "target/release/native-lzma-x64.exe"
            "target/release/native-zlib-x64.exe"
            "target/release/native-uninst-x64.exe"
          )
          Compress-Archive -LiteralPath $files -DestinationPath nano-installer-native-x64.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nano-installer-native-x64
          path: nano-installer-native-x64.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: nano-installer-native-x64.zip
