name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native-win7-release:
    name: Native Win7+ Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-11-08
          components: rust-src

      - name: Configure MSVC tools
        uses: ilammy/msvc-dev-cmd@v1

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build and audit Win7+ artifacts
        shell: powershell
        run: .\scripts\build.ps1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nano-installer-native-x64
          path: |
            target/release/nano-installer-native-x64.exe
            target/release/nano-installer-gui-x64.exe
            target/release/stubs/lzma-stub-native.exe
            target/release/stubs/zlib-stub-native.exe
            target/release/stubs/uninst-stub-native.exe

      - name: Build release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: .\scripts\changelog_notes.ps1 -Tag $env:GITHUB_REF_NAME -OutputPath tmp\release-notes.md

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: tmp/release-notes.md
          files: |
            target/release/nano-installer-native-x64.exe
            target/release/nano-installer-gui-x64.exe
            target/release/stubs/lzma-stub-native.exe
            target/release/stubs/zlib-stub-native.exe
            target/release/stubs/uninst-stub-native.exe
