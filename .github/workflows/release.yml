name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  # The release gate reads this repository's own CI runs, so it needs to see
  # them: the tag is pushed by hand and the release job does not run the suite.
  actions: read

jobs:
  native-win7-release:
    name: Native Win7+ Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-11-08
          components: rust-src

      # A maintained fork of ilammy/msvc-dev-cmd, which is still on the
      # deprecated Node 20 runtime and has had no release since 2024. This one
      # runs on Node 24 and takes the same inputs, but it has no default, so the
      # architecture ilammy used to assume is now stated.
      - name: Configure MSVC tools
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      # A release number is a date, so it can be wrong. A tag named for a day
      # that never happened, one that does not match the commit it releases, or
      # one that disagrees with the version in Cargo.toml, fails here rather
      # than being published and cleaned up later.
      - name: Check the release tag is the version being built
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          $versionLine = Get-Content -LiteralPath Cargo.toml -Encoding UTF8 |
            Where-Object { $_ -match '^version\s*=\s*"' } | Select-Object -First 1
          $version = [regex]::Match($versionLine, '"([^"]+)"').Groups[1].Value
          .\scripts\release_version.ps1 -Tag $env:GITHUB_REF_NAME -Version $version -Commit $env:GITHUB_SHA

      # Before anything expensive is built: the binaries this job publishes are
      # only as tested as the CI run behind the commit the tag names, and a run of
      # this repository is ended routinely when a newer push supersedes it. A
      # commit whose newest push run is not a success is refused here, in seconds,
      # rather than published and cleaned up afterwards.
      - name: Check the commit has a green suite behind it
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\scripts\audit_release_evidence.ps1 -Commit $env:GITHUB_SHA

      # The build links, so it runs the way the test job runs its own: in a
      # process with a console of its own, whose output goes into a file this step
      # prints. A process the build leaves behind -- the linker's telemetry helper
      # -- inherits what it was given, and one that inherits this step's output
      # holds the step open for as long as the job lasts, with no log and no
      # timeout that reaches it. The deadline is longer than a cold release build
      # needs, so a build that hangs fails the step with the last of its output.
      - name: Build and audit Win7+ artifacts
        shell: powershell
        run: |
          . .\scripts\step_job.ps1
          New-Item -ItemType Directory -Force -Path target | Out-Null
          $start = New-Object System.Diagnostics.ProcessStartInfo
          $start.FileName = "cmd.exe"
          $start.Arguments = "/c `"powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build.ps1 > target\build.log 2>&1`""
          $start.UseShellExecute = $true
          $start.WindowStyle = [System.Diagnostics.ProcessWindowStyle]::Hidden
          $process = [System.Diagnostics.Process]::Start($start)
          if (-not $process.WaitForExit(40 * 60 * 1000)) {
            Write-Output "the build did not end within 40 minute(s); what it wrote so far follows"
            Get-Content -LiteralPath target\build.log -Tail 60
            foreach ($line in (& taskkill /PID $process.Id /T /F 2>&1)) { Write-Output "  | $line" }
            exit 1
          }
          $code = $process.ExitCode
          Get-Content -LiteralPath target\build.log
          exit $code

      # What says a download arrived whole. The digests are of the files this run
      # built, and the list is uploaded as an artifact here and attached to the
      # release below, in the form `sha256sum -c` reads.
      - name: Write the digests of the published assets
        shell: powershell
        run: .\scripts\release_manifest.ps1 -Output tmp\SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: nano-installer-native-x64
          path: |
            target/release/nano-installer-native-x64.exe
            target/release/nano-installer-gui-x64.exe
            target/release/stubs/lzma-stub-native.exe
            target/release/stubs/zlib-stub-native.exe
            target/release/stubs/uninst-stub-native.exe
            tmp/SHA256SUMS.txt

      - name: Build release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: .\scripts\changelog_notes.ps1 -Tag $env:GITHUB_REF_NAME -OutputPath tmp\release-notes.md

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          body_path: tmp/release-notes.md
          files: |
            target/release/nano-installer-native-x64.exe
            target/release/nano-installer-gui-x64.exe
            target/release/stubs/lzma-stub-native.exe
            target/release/stubs/zlib-stub-native.exe
            target/release/stubs/uninst-stub-native.exe
            tmp/SHA256SUMS.txt
