name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  native-win7-verify:
    name: Native Win7+ Verify
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-11-08
          components: rust-src,rustfmt

      - name: Configure MSVC tools
        uses: ilammy/msvc-dev-cmd@v1

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test native builder and bundle
        run: cargo test --locked -p nano-installer-native

      - name: Build and audit Win7+ artifacts
        shell: powershell
        run: .\scripts\build.ps1 -Project examples\TapTap
