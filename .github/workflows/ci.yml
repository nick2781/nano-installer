name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  windows-verify:
    name: Windows Verify
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.1
          components: rustfmt

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test library
        run: cargo test --locked -p nano-installer-lib --lib

      - name: Test CLI
        run: cargo test --locked -p nano-installer-cli

      - name: Check installer crates
        run: cargo check --locked --workspace

      - name: Lint TapTap UI resources
        run: cargo run --locked -p nano-installer-cli -- harness lint-resources --project examples/TapTap --format text

      - name: Build release stubs
        run: |
          cargo build --locked --release -p nano-installer-lzma
          cargo build --locked --release -p nano-installer-zlib
          cargo build --locked --release -p uninst
          cargo build --locked --release -p nano-installer-cli

      - name: Build TapTap setup
        run: cargo run --locked --release -p nano-installer-cli -- build --project examples/TapTap --release

      - name: Upload TapTap setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: TapTap_Setup
          path: examples/TapTap/dist/TapTap_Setup.exe
