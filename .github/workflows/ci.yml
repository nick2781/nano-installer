name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-win7-build:
    name: Native Win7+ Build
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-11-08
          components: rust-src,rustfmt,clippy

      - name: Configure MSVC tools
        uses: ilammy/msvc-dev-cmd@v1

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      # Runs first and on its own so a script that would be decoded with the
      # ANSI code page fails clearly instead of surfacing as corrupted text in
      # published release notes.
      - name: Check script encodings
        shell: powershell
        run: .\scripts\audit_script_encoding.ps1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --locked --workspace

      # Builds the builder, the three stubs, and the GUI. It deliberately
      # does not build a setup from examples/TapTap: that example payload is
      # not tracked, and real end-to-end setup validation belongs to a
      # dedicated test job.
      - name: Build Win7+ toolchain
        shell: powershell
        run: .\scripts\build.ps1
