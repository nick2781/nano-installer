name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-win7-build:
    name: Native Win7+ Build
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-11-08
          components: rust-src,rustfmt,clippy

      # A maintained fork of ilammy/msvc-dev-cmd, which is still on the
      # deprecated Node 20 runtime and has had no release since 2024. This one
      # runs on Node 24 and takes the same inputs, but it has no default, so the
      # architecture ilammy used to assume is now stated.
      - name: Configure MSVC tools
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      # Runs first and on its own so a script that would be decoded with the
      # ANSI code page fails clearly instead of surfacing as corrupted text in
      # published release notes.
      - name: Check script encodings
        shell: powershell
        run: .\scripts\audit_script_encoding.ps1

      # The release job builds the published notes with Windows PowerShell, so
      # run the same generator here, where the ANSI code page is not UTF-8 and a
      # BOM-less script decodes wrongly.
      - name: Verify release notes generation
        shell: powershell
        run: .\scripts\verify_release_notes.ps1

      # A release number is a date, and the date has to be the project's
      # calendar day for the commit it releases, and has to name the version in
      # Cargo.toml. These cases pin those rules down.
      - name: Verify CalVer version rules
        shell: powershell
        run: .\scripts\verify_release_version.ps1

      # A tests/ directory that sits next to the virtual manifest instead of
      # inside a package looks like an integration suite but is never compiled,
      # so its cases silently never run. That already happened once here.
      - name: Audit test targets
        shell: powershell
        run: .\scripts\audit_test_targets.ps1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Build the test targets
        run: cargo test --locked --workspace --no-run

      # The run is bounded so a case that never returns fails the job naming the
      # test it was in, rather than holding the job until the 60 minute timeout.
      - name: Test workspace
        shell: powershell
        run: |
          $log = Join-Path $env:GITHUB_WORKSPACE "target\workspace-tests.txt"
          $process = Start-Process cargo -ArgumentList "test","--locked","--workspace" -NoNewWindow -PassThru -RedirectStandardOutput $log -RedirectStandardError "$log.err"
          $deadline = (Get-Date).AddMinutes(10)
          while (-not $process.HasExited -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 5
          }
          if (-not $process.HasExited) {
            taskkill /PID $process.Id /T /F | Out-Null
            Write-Output "::error::the workspace test run did not finish within 10 minutes; the last output follows"
            foreach ($line in (Get-Content $log -Tail 25)) {
              Write-Output ("::error::" + $line.Replace("%", "%25"))
            }
            Get-Content $log -Tail 25
            Get-Content "$log.err" -Tail 25
            exit 1
          }
          $code = $process.ExitCode
          Get-Content $log
          Get-Content "$log.err"
          exit $code

      # Builds the builder, the three stubs, and the GUI. It deliberately
      # does not build a setup from examples/TapTap: that example payload is
      # not tracked. Setup-level validation runs in setup-end-to-end below,
      # against a fixture the suite writes itself.
      - name: Build Win7+ toolchain
        shell: powershell
        run: .\scripts\build.ps1

  setup-end-to-end:
    name: Setup End to End
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-11-08

      - name: Configure MSVC tools
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      # The suite writes its own project, builds a setup, runs it, and then runs
      # the uninstaller it deployed. It installs below the temporary directory
      # and registers under a per-case HKCU key, so it needs no product payload
      # and touches nothing outside the machine it runs on.
      #
      # One script builds the runtimes the suite embeds, runs it with the skip
      # turned into a failure, and writes the report the artifact below holds, so
      # what a reader looks at afterwards is what this job ran.
      - name: Build a setup, install it, and uninstall it
        shell: powershell
        run: .\scripts\run_e2e_setup.ps1

      - name: Upload the suite report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: target/e2e-report.txt
