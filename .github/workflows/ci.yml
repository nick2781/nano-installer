name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  windows-verify:
    name: Windows Verify
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.81.0
          components: rustfmt

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test library
        run: cargo test -p nano-installer-lib --lib

      - name: Test CLI
        run: cargo test -p nano-installer-cli

      - name: Check installer crates
        run: cargo check -p nano-installer-lib -p nano-installer-cli -p nano-installer-lzma -p uninst

      - name: Lint TapTap UI resources
        run: cargo run -p nano-installer-cli -- harness lint-resources --project examples/TapTap --format text

      - name: Lint TapTap-Global UI resources
        run: cargo run -p nano-installer-cli -- harness lint-resources --project examples/TapTap-Global --format text

      - name: Build release stubs
        run: cargo build --release -p nano-installer-lzma -p uninst -p nano-installer-cli

      - name: Build TapTap setup
        run: cargo run --release -p nano-installer-cli -- build --project examples/TapTap

      - name: Build TapTap-Global setup
        run: cargo run --release -p nano-installer-cli -- build --project examples/TapTap-Global

      - name: Upload TapTap setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: TapTap_Setup
          path: examples/TapTap/dist/TapTap_Setup.exe

      - name: Upload TapTap-Global setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: TapTap_Global_Setup
          path: examples/TapTap-Global/dist/TapTap_Global_Setup.exe
