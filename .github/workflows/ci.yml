name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-win7-build:
    name: Native Win7+ Build
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-11-08
          components: rust-src,rustfmt,clippy

      # A maintained fork of ilammy/msvc-dev-cmd, which is still on the
      # deprecated Node 20 runtime and has had no release since 2024. This one
      # runs on Node 24 and takes the same inputs, but it has no default, so the
      # architecture ilammy used to assume is now stated.
      - name: Configure MSVC tools
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      # Runs first and on its own so a script that would be decoded with the
      # ANSI code page fails clearly instead of surfacing as corrupted text in
      # published release notes.
      - name: Check script encodings
        shell: powershell
        run: .\scripts\audit_script_encoding.ps1

      # The release job builds the published notes with Windows PowerShell, so
      # run the same generator here, where the ANSI code page is not UTF-8 and a
      # BOM-less script decodes wrongly.
      - name: Verify release notes generation
        shell: powershell
        run: .\scripts\verify_release_notes.ps1

      # A release number is a date, and the date has to be the project's
      # calendar day for the commit it releases, and has to name the version in
      # Cargo.toml. These cases pin those rules down.
      - name: Verify CalVer version rules
        shell: powershell
        run: .\scripts\verify_release_version.ps1

      # A tests/ directory that sits next to the virtual manifest instead of
      # inside a package looks like an integration suite but is never compiled,
      # so its cases silently never run. That already happened once here.
      - name: Audit test targets
        shell: powershell
        run: .\scripts\audit_test_targets.ps1

      # A report describes each case in the language it is read in, and the
      # table that holds those words has to cover the cases the sources
      # declare: a case without a row would read as English on the Chinese page.
      - name: Audit case descriptions
        shell: powershell
        run: .\scripts\audit_case_descriptions.ps1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # The suite runs through the script a developer runs, which writes
      # target/test-report.txt and target/test-report.html and leaves both as
      # this job's artifact: the commit, the toolchain, the whole output, the
      # result line of every target and the totals. The page is the same run
      # laid out for a reader: one row per case with what it holds, every
      # failure first, and a target linked to the cases that ran in it.
      #
      # The script also keeps the suite off the step's console, in three places. A
      # step has finished only once its own output has closed, and the linker
      # leaves a telemetry process behind that inherits whatever the build wrote
      # to and outlives it: held open that way the step never ends, archives no
      # log, and neither a step timeout nor a cancel reaches it -- a suite that
      # had already passed has taken a build agent half an hour that way. So the
      # script opens a file for the suite's own output and gives the command that
      # runs it a console of its own, which shares none of this step's output; and
      # everything the script starts joins a job that ends with it, so a process it
      # leaves behind -- a wizard a failing case did not close, that same telemetry
      # process -- does not outlive the step either. A command that does not end is
      # waited on with a deadline, which prints the last lines it wrote and the
      # processes it was waiting on, so a suite that hangs fails this step with a
      # log that says where, instead of hanging for hours.
      - name: Test workspace
        shell: powershell
        run: .\scripts\run_tests.ps1

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: |
            target/test-report.txt
            target/test-report.html

      # Builds the builder, the three stubs, and the GUI. It deliberately
      # does not build a setup from examples/TapTap: that example payload is
      # not tracked. Setup-level validation runs in setup-end-to-end below,
      # against a fixture the suite writes itself.
      #
      # This build links, so it gets the same treatment as the suite above: its
      # output goes into a file the step prints when the build is done, and the
      # build runs in a process with a console of its own, because a process the
      # build starts and leaves behind -- the linker's telemetry helper -- inherits
      # whatever it was given, and one that inherits this step's output holds the
      # step open for as long as the job lasts. Its deadline is longer than a warm
      # build needs, so a build that hangs fails the step with the last of its
      # output rather than hanging for as long as the agent is willing to wait.
      - name: Build Win7+ toolchain
        shell: powershell
        run: |
          . .\scripts\step_job.ps1
          New-Item -ItemType Directory -Force -Path target | Out-Null
          $start = New-Object System.Diagnostics.ProcessStartInfo
          $start.FileName = "cmd.exe"
          $start.Arguments = "/c `"powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build.ps1 > target\build.log 2>&1`""
          $start.UseShellExecute = $true
          $start.WindowStyle = [System.Diagnostics.ProcessWindowStyle]::Hidden
          $process = [System.Diagnostics.Process]::Start($start)
          if (-not $process.WaitForExit(30 * 60 * 1000)) {
            Write-Output "the build did not end within 30 minute(s); what it wrote so far follows"
            Get-Content -LiteralPath target\build.log -Tail 60
            foreach ($line in (& taskkill /PID $process.Id /T /F 2>&1)) { Write-Output "  | $line" }
            exit 1
          }
          $code = $process.ExitCode
          Get-Content -LiteralPath target\build.log
          exit $code

  setup-end-to-end:
    name: Setup End to End
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-11-08

      - name: Configure MSVC tools
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      # The suite writes its own project, builds a setup, runs it, and then runs
      # the uninstaller it deployed. It installs below the temporary directory
      # and registers under a per-case HKCU key, so it needs no product payload
      # and touches nothing outside the machine it runs on.
      #
      # One script builds the runtimes the suite embeds, runs it with the skip
      # turned into a failure, and writes the two reports the artifact below
      # holds, so what a reader looks at afterwards is what this job ran.
      - name: Build a setup, install it, and uninstall it
        shell: powershell
        run: .\scripts\run_e2e_setup.ps1

      - name: Upload the suite report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            target/e2e-report.txt
            target/e2e-report.html
