name: Docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "assets/nano-technology.png"
      # The index files under docs/ are generated from this data file, so a change
      # to it alone changes what the site publishes.
      - "scripts/docs_index.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  publish-docs:
    name: Publish docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # docs/assets/nano-technology.png is Git LFS tracked; without this
          # Pages would publish the 130-byte pointer file instead of the PNG.
          lfs: true

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # The site is a viewer over the Markdown files beside it, and three of those
      # files are what makes the pages findable to something that cannot run the
      # viewer: llms.txt, robots.txt and sitemap.xml. They are generated from
      # scripts/docs_index.json, so this fails rather than publishing a site whose
      # index no longer lists the page someone just added. It runs on this runner
      # (pwsh is installed on the Ubuntu images), so a Windows checkout and this
      # one are held to the same files.
      - name: Verify the documentation index
        shell: pwsh
        run: ./scripts/build_docs_index.ps1 -Verify

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
          # docs/ ships a .nojekyll marker, and v4 began excluding dotfiles by
          # default, so it would quietly stop being deployed. The marker is
          # there because the site serves _sidebar.md and _navbar.md, the
          # underscore-prefixed files Jekyll withholds.
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
