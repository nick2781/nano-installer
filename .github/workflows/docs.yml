name: Docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "assets/nano-technology.png"
      # The index files under docs/ are generated from this data file, so a change
      # to it alone changes what the site publishes.
      - "scripts/docs_index.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  publish-docs:
    name: Publish docs
    # Named rather than `-latest`: `ubuntu-latest` is announced to move to
    # Ubuntu 26 on 2026-10-19, and this job publishes the site. `ubuntu-24.04` is
    # what the label resolves to today.
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # docs/assets/nano-technology.png is Git LFS tracked; without this
          # Pages would publish the 130-byte pointer file instead of the PNG.
          lfs: true

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # The site is a viewer over the Markdown files beside it, and three of those
      # files are what makes the pages findable to something that cannot run the
      # viewer: llms.txt, robots.txt and sitemap.xml. They are generated from
      # scripts/docs_index.json, so this fails rather than publishing a site whose
      # index no longer lists the page someone just added. It runs on this runner
      # (pwsh is installed on the Ubuntu images), so a Windows checkout and this
      # one are held to the same files.
      - name: Verify the documentation index
        shell: pwsh
        run: ./scripts/build_docs_index.ps1 -Verify

      # The pages come in two languages, and the switch in the top bar is how a
      # reader crosses between them. It can only pair what both trees hold, so
      # this fails when a page is added to one tree alone, or when the switch's
      # own list of pages drifts from the files beside it.
      - name: Audit the language pairs
        shell: pwsh
        run: ./scripts/audit_docs_languages.ps1

      # The switch is script in the viewer, and a runner has no browser, so
      # its routing is checked against a stand-in for one: which language the
      # site root opens in, where a switch moves to, and where a page with no
      # twin sends a reader.
      - name: Check the language switch
        run: node scripts/check_language_switch.js

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
          # docs/ ships a .nojekyll marker, and v4 began excluding dotfiles by
          # default, so it would quietly stop being deployed. The marker is
          # there because the site serves _sidebar.md and _navbar.md, the
          # underscore-prefixed files Jekyll withholds.
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
