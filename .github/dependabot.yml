version: 2

updates:
  # Dependencies are pinned by Cargo.lock and by the nightly toolchain CI builds with, so these
  # pull requests are a reminder rather than an automatic bump. An archive or Win32 crate moves
  # only after it has been built against the Windows 7 baseline and the whole suite is green,
  # which is a person's decision and not a merge button.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      # Patch and minor updates arrive as one pull request. A major version is left on its own:
      # an archive or Win32 crate that changes its own API is a change to this project's code too,
      # and it should not be able to fail a suite on behalf of eight unrelated bumps.
      cargo-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The workflows pin a major version on purpose: a new major is read before it is taken.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
